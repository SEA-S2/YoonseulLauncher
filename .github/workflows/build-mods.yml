name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**'
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoonseul-helper
          unzip -q mods/yoonseul-helper-src.zip -d build/yoonseul-helper
      - name: Build Yoondding
        working-directory: build/yoonseul-helper
        run: gradle :fabric:build -x test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: build/yoonseul-helper/fabric/build/libs/yoonseul-ledger-fabric-0.2.1.jar
          if-no-files-found: error

  build-launcher:
    if: github.ref == 'refs/heads/main'
    needs: [build-ledger]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher_config.json dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.6.3
          path: |
            dist/Yoonseul_Launcher.exe
            dist/launcher_config.json
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Yoonseul_Launcher.exe,dist/launcher_config.json -DestinationPath Yoonseul_Launcher-2.6.3.zip
      - name: Publish 2.6.3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6.3 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v2.6.3 --title "2.6.3" --notes "개발자 알림과 지원 안내 문구 정리" }
          if ((gh release view v2.6.3 --json assets --jq '.assets[].name') -contains 'Yoonseul_Launcher-2.6.3-Windows.zip') { gh release delete-asset v2.6.3 Yoonseul_Launcher-2.6.3-Windows.zip --yes }
          gh release upload v2.6.3 Yoonseul_Launcher-2.6.3.zip --clobber
          gh release edit v2.6.3 `
            --title "2.6.3" `
            --notes "윤슬 런처 2.6.3입니다.`n`n- 개발자 알림과 지원 안내 문구 정리`n- 지원 채널 버튼에서 Discord SEA_S2 프로필 연결`n- 2.6.2의 오른쪽 Shift 입력 화면 충돌 수정 포함" `
            --latest
