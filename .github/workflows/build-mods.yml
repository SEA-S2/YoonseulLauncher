name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**'
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoonseul-helper
          unzip -q mods/yoonseul-helper-src.zip -d build/yoonseul-helper
      - name: Build Yoondding
        working-directory: build/yoonseul-helper
        run: gradle :fabric:build -x test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: build/yoonseul-helper/fabric/build/libs/yoonseul-ledger-fabric-0.2.1.jar
          if-no-files-found: error

  build-launcher:
    if: github.ref == 'refs/heads/main'
    needs: [build-ledger]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher_config.json dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.6.4
          path: |
            dist/Yoonseul_Launcher.exe
            dist/launcher_config.json
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Yoonseul_Launcher.exe,dist/launcher_config.json -DestinationPath Yoonseul_Launcher-2.6.4.zip
      - name: Publish 2.6.4 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6.4 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v2.6.4 --title "2.6.4" --notes "입력 화면의 오른쪽 Shift 단축키 충돌 재수정" }
          gh release upload v2.6.4 Yoonseul_Launcher-2.6.4.zip --clobber
          gh release edit v2.6.4 `
            --title "2.6.4" `
            --notes "윤슬 런처 2.6.4입니다.`n`n- 기린월드 코어가 열린 입력 화면을 직접 추적하도록 수정`n- 귓속말·타이머 입력 중 오른쪽 Shift가 허브를 여는 문제 차단`n- 기존 허브 UI·단축키·HUD·설정 기능 유지" `
            --latest
