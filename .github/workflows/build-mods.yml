name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**'
      - 'assets/**'
      - 'tools/**'
      - 'launcher-src-*.zip.part-*'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoonseul-helper
          unzip -q mods/yoonseul-helper-src.zip -d build/yoonseul-helper
      - name: Build Yoondding
        working-directory: build/yoonseul-helper
        run: gradle :fabric:build -x test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: build/yoonseul-helper/fabric/build/libs/yoonseul-ledger-fabric-0.2.1.jar
          if-no-files-found: error

  build-launcher:
    if: github.ref == 'refs/heads/main'
    needs: [build-ledger]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack launcher source
        shell: pwsh
        run: |
          $output = [System.IO.File]::Create("launcher-src-0.3.8.fixed.zip")
          Get-ChildItem "launcher-src-0.3.8.zip.part-*" | Sort-Object Name | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $output.Write($bytes, 0, $bytes.Length)
          }
          $output.Close()
          New-Item -ItemType Directory -Force launcher | Out-Null
          tar -xf launcher-src-0.3.8.fixed.zip -C launcher
          python tools/patch_launcher_agent.py launcher assets/dongleland-core.jar
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: launcher/assets
      - name: Install launcher dependencies
        working-directory: launcher
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        working-directory: launcher
        run: python -m PyInstaller --noconfirm YoonseulLauncher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher/launcher_config.json launcher/dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: YoonseulLauncher-0.4.1-Windows
          path: |
            launcher/dist/YoonseulLauncher.exe
            launcher/dist/launcher_config.json
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path launcher/dist/YoonseulLauncher.exe,launcher/dist/launcher_config.json -DestinationPath YoonseulLauncher-0.4.1-Windows.zip
      - name: Publish 0.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.1 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v0.4.1 --title "윤슬 런처 0.4.1" --notes "원본 클라이언트 코어 복원판" }
          gh release upload v0.4.1 YoonseulLauncher-0.4.1-Windows.zip --clobber
          gh release edit v0.4.1 `
            --title "윤슬 런처 0.4.1" `
            --notes "올려주신 동글랜드 코어를 기반으로 원래 크기와 실제 기능을 복원했습니다.`n`n- 원본 클라이언트 허브와 설정 화면`n- HUD 배치 및 정보 HUD`n- 단축어 추가·저장·전송`n- 계산기·타이머·줌·밝기·시간·자동 달리기`n- 기존 임시 대형 허브 제거" `
            --latest
