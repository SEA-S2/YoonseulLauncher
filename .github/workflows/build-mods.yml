name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**'
      - 'launcher-src-*.zip.part-*'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build Yoonseul Core
        working-directory: mods/yoonseul-core
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-core-fabric-0.1.0
          path: mods/yoonseul-core/build/libs/yoonseul-core-fabric-0.1.0.jar
          if-no-files-found: error

  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoonseul-helper
          unzip -q mods/yoonseul-helper-src.zip -d build/yoonseul-helper
      - name: Build Yoondding
        working-directory: build/yoonseul-helper
        run: gradle :fabric:build -x test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: build/yoonseul-helper/fabric/build/libs/yoonseul-ledger-fabric-0.2.1.jar
          if-no-files-found: error

  build-launcher:
    if: github.ref == 'refs/heads/main'
    needs: [build-core, build-ledger]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack launcher source
        shell: pwsh
        run: |
          $output = [System.IO.File]::Create("launcher-src-0.3.8.fixed.zip")
          Get-ChildItem "launcher-src-0.3.8.zip.part-*" | Sort-Object Name | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $output.Write($bytes, 0, $bytes.Length)
          }
          $output.Close()
          New-Item -ItemType Directory -Force launcher | Out-Null
          tar -xf launcher-src-0.3.8.fixed.zip -C launcher
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-core-fabric-0.1.0
          path: launcher/assets
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.1
          path: launcher/assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: launcher/requirements.txt
      - name: Install launcher dependencies
        working-directory: launcher
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        working-directory: launcher
        run: python -m PyInstaller --noconfirm YoonseulLauncher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher/launcher_config.json launcher/dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: YoonseulLauncher-0.3.9-Windows
          path: |
            launcher/dist/YoonseulLauncher.exe
            launcher/dist/launcher_config.json
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        run: Compress-Archive -Path launcher/dist/YoonseulLauncher.exe,launcher/dist/launcher_config.json -DestinationPath YoonseulLauncher-0.3.9-Windows.zip
      - name: Publish 0.3.9 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.9 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v0.3.9 --title "윤슬 런처 0.3.9" --notes "윤띵 교체 오류 수정" }
          gh release upload v0.3.9 YoonseulLauncher-0.3.9-Windows.zip --clobber
          gh release edit v0.3.9 `
            --title "윤슬 런처 0.3.9" `
            --notes "구형 낙인·윤슬 장부 JAR을 윤띵 0.2.1로 자동 교체합니다.`n`n- /윤띵 명령어 정상 등록`n- 낙인 중복 로딩 방지`n- 허브의 잘못된 윤띵 열기 버튼 제거`n- 새로 빌드한 코어와 윤띵 JAR을 런처에 직접 포함" `
            --latest
